# Publish slides/ to GitHub Pages.
#
# There is no build: the deck is one HTML file and three assets beside it, so
# this uploads the directory as-is. Needs Settings -> Pages -> Source: GitHub
# Actions, once.
name: Publish the deck

on:
  push:
    branches: [main]
    paths:
      - 'slides/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push queues rather than cancelling the
# run ahead of it: cancel-in-progress would kill a deployment mid-flight, and
# a half-applied Pages deployment is a worse outcome than waiting a minute for
# one whose output is about to be replaced anyway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structure
        run: python3 slides/check_deck.py

      # The QR code on the title frame is generated from one URL, and it
      # is the only figure in the deck nobody can proofread by looking at
      # it. A stale one publishes a working slide pointing somewhere
      # wrong, so it fails here instead.
      - name: Setup QR is current
        run: |
          python3 -m pip install --quiet segno
          python3 slides/render_qr.py --check

  publish:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: slides
      - id: deploy
        uses: actions/deploy-pages@v4
