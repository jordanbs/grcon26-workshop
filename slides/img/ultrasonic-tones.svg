<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" role="img" aria-label="The same response at 46 Hz resolution across the peak, in dB below the peak. f0 is 40.755 kHz; the space tone at 40.455 kHz and the mark tone at 41.055 kHz sit either side of it, both within a decibel of each other.">
  <style>
  .bg   { fill: #fafaf7; }
  .axis { stroke: #5a5a5a; stroke-width: 1; fill: none; }
