[project]
name = "grcon26-workshop"
version = "0.1.0"
description = "GNU Radio + ADALM2000 workshop material for GRCon26"
readme = "README.md"
requires-python = ">=3.9"

# Deliberately empty. This is the repository's test and tooling harness, not
# a package anyone installs -- the thing participants install is gr-m2k/,
# which has its own pyproject.toml. Everything in iio-tools/ is standard
# library only, so a participant can copy a single file onto a machine and
# run it. The one exception is the libiio binding that iio_discover.py
# needs, and that cannot come from pip in any reliable way -- see the note
# below.
dependencies = []

[dependency-groups]
dev = [
    "pillow>=11.3.0",
    "pytest>=8",
    "segno>=1.6.6",
    "zxing-cpp>=3.1.1",
]

[tool.uv]
# Scripts in iio-tools/ and slides/, not an installable package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ---------------------------------------------------------------------------
# About libiio
#
# `iio-tools/iio_discover.py` imports `iio`, the libiio Python binding. It is not listed
# as a dependency on purpose:
#
#   * The binding is a wrapper around a native library. Installing the Python
#     side without the matching libiio.so gives you an import that fails at
#     runtime instead of at install time, which is worse than not having it.
#   * On Linux the supported route is the distro package (python3-libiio),
#     which lands in system site-packages, where a normal uv venv cannot see
#     it.
#
# So: to run the explainer, the tests, or anything offline, a plain uv venv is
# all you need. To run discovery against real hardware, build the venv so it
# can see the system packages:
#
#     uv venv --system-site-packages
#     uv sync
#     uv run ./iio-tools/iio_discover.py --scan
#
# Or skip the venv for that one script and run it with system python, which is
# what its shebang does:
#
#     ./iio-tools/iio_discover.py --scan
# ---------------------------------------------------------------------------
